name: Bug
description: The runner, a gate or the skill did the wrong thing.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, and what you expected }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce, description: "A minimal repo or the commands you ran." }
    validations: { required: true }
  - type: textarea
    id: output
    attributes: { label: Output, render: text }
  - type: input
    id: env
    attributes: { label: "gauntlet version, OS, shell, harness", placeholder: "v0.1.0, macOS 15, bash 5.2, Claude Code" }
