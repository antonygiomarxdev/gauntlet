name: New stack, detector or agent adapter
description: Support for a language, linter, CI provider or agent harness.
labels: [enhancement]
body:
  - type: input
    id: target
    attributes: { label: What should gauntlet support?, placeholder: "golangci-lint output, GitLab CI, Codex hooks" }
    validations: { required: true }
  - type: textarea
    id: usecase
    attributes: { label: The use case }
    validations: { required: true }
