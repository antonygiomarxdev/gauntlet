name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep shellcheck
          pipx install ast-grep-cli

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep ast-grep shellcheck

      - name: Shellcheck
        run: shellcheck -x bin/gauntlet lib/*.sh test/*.sh

      - name: Test (Ubuntu)
        if: runner.os == 'Linux'
        run: bash test/run.sh

      # Homebrew bash 5 may shadow bash 3.2 on PATH; the system /bin/bash is the
      # compatibility target macOS users run.
      - name: Test (macOS, system bash 3.2)
        if: runner.os == 'macOS'
        run: /bin/bash test/run.sh
